[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archword"
version = "0.1.0"
description = "Предсказание, какие слова русской классики современному читателю нужно пояснить"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "markdown", "jinja2"]
morph = ["pymorphy3>=2.0", "pymorphy3-dicts-ru"]
nlp = ["torch>=2.1", "transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E731"]
